<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOTH: Congress Review</title>
<style>
  :root{
    --bg:#ffffff; --page:#f4f4f5; --text:#1a1a1a; --muted:#5a5a5a; --border:#d4d4d4;
    --accent:#2b5fad;
    --dem:#3b6fa5; --rep:#a5423b; --ind:#6b6b6b; --good:#2e7d32; --bad:#b3261e;
    --w: 380px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:32px 16px 48px;
  }
  button, select{ font-family:inherit; }

  .panel{ width:100%; max-width:640px; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:20px; }
  .state-grid{ display:flex; flex-wrap:wrap; gap:8px; max-height:280px; overflow-y:auto; padding:2px; margin-bottom:16px; }
  .mode-tabs{ display:flex; gap:0; border:1px solid var(--border); border-radius:4px; overflow:hidden; width:fit-content; margin-bottom:16px; }
  .mode-tab{ font-family:inherit; font-size:0.85rem; padding:8px 16px; border:none; background:var(--bg); color:var(--text); cursor:pointer; border-right:1px solid var(--border); }
  .mode-tab:last-child{ border-right:none; }
  .mode-tab.active{ background:var(--accent); color:#fff; }
  .state-chip{
    border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:4px;
    padding:7px 13px; font-size:0.85rem; cursor:pointer;
  }
  .state-chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .state-chip.custom-chip{ display:inline-flex; align-items:center; gap:6px; }
  .chip-del{ border:none; background:none; color:inherit; opacity:0.6; cursor:pointer; font-size:0.9rem; line-height:1; padding:0; }
  .chip-del:hover{ opacity:1; }
  .add-group-btn{
    border:1px dashed var(--border); background:var(--page); color:var(--accent); border-radius:4px;
    padding:7px 13px; font-size:0.85rem; cursor:pointer;
  }
  .group-builder{
    border:1px solid var(--border); border-radius:4px; padding:14px; margin:4px 0 16px; background:var(--page);
  }
  .group-builder .name-input{
    width:100%; border:1px solid var(--border); border-radius:4px; padding:9px 12px; font-size:0.9rem;
    font-family:inherit; margin-bottom:10px; color:var(--text); background:var(--bg);
  }
  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-input{
    width:100%; border:1px solid var(--border); border-radius:4px; padding:9px 12px; font-size:0.9rem;
    font-family:inherit; color:var(--text); background:var(--bg);
  }
  .search-results{
    border:1px solid var(--border); border-top:none; border-radius:0 0 4px 4px; background:var(--bg);
    max-height:180px; overflow-y:auto;
  }
  .search-result{
    display:flex; justify-content:space-between; align-items:center; padding:8px 12px; font-size:0.88rem;
    border-top:1px solid var(--border); cursor:pointer;
  }
  .search-result:first-child{ border-top:none; }
  .search-result:hover{ background:var(--page); }
  .search-result .add-hint{ color:var(--accent); font-size:0.8rem; }
  .search-result.already{ opacity:0.45; cursor:default; }
  .added-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; min-height:1px; }
  .added-tag{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--bg);
    border-radius:4px; padding:4px 8px; font-size:0.82rem;
  }
  .builder-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .panel-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .panel-actions .hint{ font-size:0.85rem; color:var(--muted); }
  .btn{ border-radius:4px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:9px 16px; font-size:0.9rem; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.link{ border:none; background:none; color:var(--accent); text-decoration:underline; cursor:pointer; padding:4px; font-size:0.85rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  #quizWrap{ width:100%; max-width:var(--w); }
  .chunkbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:0.8rem; color:var(--muted); margin-bottom:10px; }
  .stats{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .stat{ font-size:0.75rem; padding:3px 9px; border-radius:4px; border:1px solid var(--border); background:var(--bg); }
  .bar{ height:4px; width:100%; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:18px; }
  .fill{ height:100%; width:0%; background:var(--accent); transition:width 0.35s ease; }

  .card{
    position:relative; background:var(--bg); border:1px solid var(--border); border-radius:4px;
    padding:22px; display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:16px;
  }
  .tag-chip{ position:absolute; top:14px; right:16px; font-size:0.72rem; color:var(--muted); border:1px solid var(--border); padding:2px 8px; border-radius:4px; background:var(--page); }
  .photo-frame{ width:180px; height:218px; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:#eee; position:relative; }
  .photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-fallback{
    display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; background:var(--accent); color:#fff; text-align:center; padding:10px;
  }
  .photo-fallback .initials{ font-size:2rem; font-weight:600; }
  .photo-fallback .note{ font-size:0.7rem; opacity:0.85; line-height:1.3; }
  .prompt{ margin:0; font-size:0.9rem; color:var(--muted); }

  .choices{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .choice{ text-align:left; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:4px; padding:11px 14px; font-size:0.92rem; cursor:pointer; }
  .choice:hover:not(:disabled){ border-color:var(--accent); }
  .choice.correct{ border-color:var(--good); background:#EAF4EC; }
  .choice.wrong{ border-color:var(--bad); background:#FBEAEC; }
  .choice:disabled{ cursor:default; }

  .feedback{ width:100%; text-align:center; padding-top:6px; }
  .feedback .verdict{ font-weight:600; font-size:1.05rem; margin:0 0 4px; }
  .verdict.good{ color:var(--good); }
  .verdict.bad{ color:var(--bad); }
  .feedback .meta{ margin:0 0 12px; font-size:0.85rem; color:var(--muted); }
  .chip{ display:inline-block; font-size:0.78rem; padding:3px 11px; border-radius:4px; color:#fff; margin-bottom:12px; }
  .chip.D{ background:var(--dem); } .chip.R{ background:var(--rep); } .chip.I{ background:var(--ind); }

  .done{ text-align:center; }
  .done h2{ font-size:1.3rem; margin:0 0 8px; }
  .done-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }

  .type-form{ display:flex; gap:8px; width:100%; }
  .type-input{
    flex:1; border:1px solid var(--border); border-radius:4px; padding:11px 14px; font-size:0.95rem;
    color:var(--text); background:var(--bg); font-family:inherit;
  }
  .type-input:focus{ outline:none; border-color:var(--accent); }
  .type-input.correct{ border-color:var(--good); background:#EAF4EC; }
  .type-input.wrong{ border-color:var(--bad); background:#FBEAEC; }
  .type-input:disabled{ opacity:0.85; }
  .type-hint{ margin:-6px 0 0; font-size:0.75rem; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<div class="panel" id="setupPanel">
  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab" data-mode="fame">By fame</button>
    <button class="mode-tab" data-mode="state">By state</button>
    <button class="mode-tab" data-mode="custom">My groups</button>
  </div>
  <div class="state-grid" id="stateGrid"></div>
  <div id="groupBuilder"></div>
  <div class="panel-actions">
    <span class="hint" id="selHint">0 selected</span>
    <button class="btn primary" id="startBtn" disabled>Start</button>
  </div>
</div>

<div id="quizWrap" hidden>
  <div class="chunkbar">
    <span id="chunkLabel"></span>
    <button class="btn link" id="changeStatesBtn">change groups</button>
  </div>
  <div class="stats" id="statsRow"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>

  <div class="card" id="quizCard">
    <span class="tag-chip" id="chamberTag"></span>
    <div class="photo-frame">
      <img id="photo" alt="Member of Congress">
      <div class="photo-fallback" id="photoFallback">
        <span class="initials" id="photoInitials"></span>
        <span class="note">No photo available yet</span>
      </div>
    </div>
    <p class="prompt" id="promptText">Who is this?</p>
    <div class="choices" id="choices"></div>
  </div>

  <div class="feedback" id="feedback" hidden>
    <p class="verdict" id="verdict"></p>
    <p class="meta" id="meta"></p>
    <div><span class="chip" id="partyChip"></span></div>
    <button class="btn primary" id="nextBtn">Next card →</button>
  </div>
</div>

<div class="panel done" id="doneScreen" hidden>
  <h2>Chunk mastered 🎉</h2>
  <p id="doneStats"></p>
  <div class="done-actions">
    <button class="btn primary" id="typingModeBtn">Switch to typing mode</button>
    <button class="btn" id="addMoreBtn">Add more</button>
  </div>
</div>

<button class="btn link" id="resetProgressBtn" style="margin-top:20px;">Reset saved progress</button>

const wikidataCache = {};
async function wikidataPhotoUrl(qid){
  if(!qid) return null;
  if(wikidataCache[qid] !== undefined) return wikidataCache[qid];
  try{
    const res = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${qid}&property=P18&format=json&origin=*`);
    const data = await res.json();
    const filename = data?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
    const url = filename ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}?width=450` : null;
    wikidataCache[qid] = url;
    return url;
  } catch(e){
    wikidataCache[qid] = null;
    return null;
  }
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

const STORAGE_KEY = 'congressFlashcards.progress.v1';
function loadSavedData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    return (data && typeof data === 'object') ? data : null;
  } catch(e){
    return null;
  }
}

}

const SUBCOMMITTEES = [];

const GROUPS = {
  fame: (() => {
    const LABELS = {
      1: 'Rarely in the news', 2: 'Everyday member',
      3: 'Regularly covered', 4: 'Well known', 5: 'Household name',
    };
    const map = {};
    RECORDS.forEach(r => {
      const lvl = r[8];
      if(!map[lvl]) map[lvl] = {label: LABELS[lvl] || String(lvl), memberIds: []};
      map[lvl].memberIds.push(r[0]);
    });
    return Object.values(map).sort((a,b) => parseInt(a.label) - parseInt(b.label));
  })(),
  state: (() => {
    const map = {};
    RECORDS.forEach(r => {
      const st = r[4];
      if(!map[st]) map[st] = {label: st, memberIds: []};
      map[st].memberIds.push(r[0]);
    });
    return Object.values(map).sort((a,b) => a.label.localeCompare(b.label));
  })(),
  committee: COMMITTEES
    .map(([id, name, chamber, members]) => ({
      key: id, label: name, chamberLabel: chamber === 'senate' ? 'Senate' : chamber === 'house' ? 'House' : 'Joint',
      memberIds: members.filter(mid => byId[mid]),
    }))
    .sort((a,b) => a.label.localeCompare(b.label)),
  subcommittee: SUBCOMMITTEES
    .map(([id, name, chamber, members]) => ({
      key: id, label: name, chamberLabel: chamber === 'senate' ? 'Senate' : chamber === 'house' ? 'House' : 'Joint',
      memberIds: members.filter(mid => byId[mid]),
    }))
    .sort((a,b) => a.label.localeCompare(b.label)),
};

}

      del.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(!confirm(`Delete "${g.label}"? This can't be undone.`)) return;
        customGroups = customGroups.filter(cg => cg.id !== g.key);
        selected.delete(g.key);
        renderGroupGrid();
        saveProgress();
      });
      wrap.appendChild(label); wrap.appendChild(del);
      stateGrid.appendChild(wrap);
    } else {
      const b = document.createElement('button');
      b.className = 'state-chip';
      const suffix = g.chamberLabel ? `, ${g.chamberLabel}` : '';
      b.textContent = `${g.label} (${g.memberIds.length})${suffix}`;
      b.dataset.key = g.key;
      if(selected.has(g.key)) b.classList.add('on');
      b.addEventListener('click', ()=>{
        if(selected.has(g.key)){ selected.delete(g.key); b.classList.remove('on'); }
        else { selected.add(g.key); b.classList.add('on'); }
        updateSelHint();
        saveProgress();
      });
      stateGrid.appendChild(b);
    }
  });
  if(groupMode === 'custom'){
    const addBtn = document.createElement('button');
    addBtn.className = 'add-group-btn'; addBtn.type = 'button';
    addBtn.textContent = '+ Add group';
    addBtn.addEventListener('click', ()=>{ builderOpen = true; draftName = ''; draftMembers = []; renderBuilder(); });
    stateGrid.appendChild(addBtn);
  }
  renderBuilder();
  updateSelHint();
}

function renderBuilder(){
  const el2 = document.getElementById('groupBuilder');
  if(groupMode !== 'custom' || !builderOpen){ el2.innerHTML = ''; return; }
  el2.innerHTML = `
    <div class="group-builder">
      <input type="text" class="name-input" id="draftNameInput" placeholder="Group name" value="${draftName.replace(/"/g,'&quot;')}">
      <div class="search-wrap">
        <input type="text" class="search-input" id="memberSearchInput" placeholder="Search members by name..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="added-list" id="addedList"></div>
      <div class="builder-actions">
        <button class="btn" id="cancelGroupBtn" type="button">Cancel</button>
        <button class="btn primary" id="saveGroupBtn" type="button">Save group</button>
      </div>
    </div>`;
  document.getElementById('draftNameInput').addEventListener('input', e=>{ draftName = e.target.value; });
  const searchInput = document.getElementById('memberSearchInput');
  searchInput.addEventListener('input', ()=> renderSearchResults(searchInput.value));
  document.getElementById('cancelGroupBtn').addEventListener('click', ()=>{ builderOpen = false; renderGroupGrid(); });
  document.getElementById('saveGroupBtn').addEventListener('click', saveDraftGroup);
  renderAddedList();
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  const q = query.trim().toLowerCase();
  if(!q){ box.innerHTML = ''; return; }
  const matches = RECORDS.filter(r => r[1].toLowerCase().includes(q)).slice(0, 8);
  if(matches.length === 0){ box.innerHTML = `<div class="search-result already">No matches</div>`; return; }
  box.innerHTML = '';
  matches.forEach(r=>{
    const id = r[0];
    const already = draftMembers.includes(id);
    const row = document.createElement('div');
    row.className = 'search-result' + (already ? ' already' : '');
    const place = r[5] ? `${r[4]}-${String(r[5]).padStart(2,'0')}` : r[4];
    row.innerHTML = `<span>${r[1]} <span style="opacity:0.6">(${r[3]}, ${place})</span></span>` +
      `<span class="add-hint">${already ? 'Added' : '+ Add'}</span>`;
    if(!already){
      row.addEventListener('click', ()=>{
        draftMembers.push(id);
        renderAddedList();
        renderSearchResults(query);
      });
    }
    box.appendChild(row);
  });
}

function renderAddedList(){
  const box = document.getElementById('addedList');
  if(!box) return;
  box.innerHTML = '';
  draftMembers.forEach(id=>{
    const rec = byId[id];
    const tag = document.createElement('span');
    tag.className = 'added-tag';
    tag.innerHTML = `${rec[1]} <button class="chip-del" type="button" title="Remove">×</button>`;
    tag.querySelector('button').addEventListener('click', ()=>{
      draftMembers = draftMembers.filter(mid => mid !== id);
      renderAddedList();
      const q = document.getElementById('memberSearchInput')?.value || '';
      renderSearchResults(q);
    });
    box.appendChild(tag);
  });
}

function saveDraftGroup(){
  const name = draftName.trim();
  if(!name){ alert('Give the group a name first.'); return; }
  if(draftMembers.length === 0){ alert('Add at least one person to the group.'); return; }
  const id = 'custom_' + Date.now();
  customGroups.push({ id, name, memberIds: [...draftMembers] });
  builderOpen = false;
  renderGroupGrid();
  saveProgress();
}
function updateSelHint(){
  document.getElementById('selHint').textContent = `${selected.size} selected`;
  document.getElementById('startBtn').disabled = selected.size === 0;
}
document.querySelectorAll('#modeTabs .mode-tab').forEach(tab=>{
  tab.classList.toggle('active', tab.dataset.mode === groupMode);
  tab.addEventListener('click', ()=>{
    if(tab.dataset.mode === groupMode) return;
    groupMode = tab.dataset.mode;
    selected.clear();
    builderOpen = false;
    document.querySelectorAll('#modeTabs .mode-tab').forEach(t=>t.classList.toggle('active', t===tab));
    renderGroupGrid();
    saveProgress();
  });
});
renderGroupGrid();

function labelFor(key){
  const g = getGroupList(groupMode).find(g => g.key === key);
  return g ? g.label : key;
}

const cardState = (SAVED && SAVED.cardState && typeof SAVED.cardState === 'object') ? SAVED.cardState : {};
let turn = (SAVED && typeof SAVED.turn === 'number') ? SAVED.turn : 0;
let pool = [];
let current = null;
let photoLoadToken = 0;
let typingMode = !!(SAVED && SAVED.typingMode);

const el = id => document.getElementById(id);
const setupPanel = el('setupPanel'), quizWrap = el('quizWrap'), doneScreen = el('doneScreen');

el('startBtn').addEventListener('click', ()=>{ buildPool(); showQuiz(); saveProgress(); });
el('changeStatesBtn').addEventListener('click', ()=>{ quizWrap.hidden = true; doneScreen.hidden = true; setupPanel.hidden = false; });
el('addMoreBtn').addEventListener('click', ()=>{ doneScreen.hidden = true; setupPanel.hidden = false; });
el('typingModeBtn').addEventListener('click', ()=>{
  pool.forEach(id => { cardState[id] = {box:0, due:0}; });
  typingMode = true;
  doneScreen.hidden = true; quizWrap.hidden = false;
  nextCard();
  saveProgress();
});

function buildPool(){
  typingMode = false;
  const idSet = new Set();
  getGroupList(groupMode).forEach(g => { if(selected.has(g.key)) g.memberIds.forEach(id => idSet.add(id)); });
  pool = [...idSet];
  pool.forEach(id => { if(!cardState[id]) cardState[id] = {box:0, due:0}; });
}

function stripToSurname(name){
  const noQuotes = name.replace(/["“”]/g, '');
  const noSuffix = noQuotes.replace(/,?\s*(jr\.?|sr\.?|ii|iii|iv|v)\s*$/i, '').trim();
  const parts = noSuffix.split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '';
}
function normalizeName(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\s'-]/g, '')
    .trim();
}
function surnameMatches(typed, fullName){
  const typedSurname = stripToSurname(typed.trim());
  if(!typedSurname) return false;
  return normalizeName(typedSurname) === normalizeName(stripToSurname(fullName));
}

function showQuiz(){
  setupPanel.hidden = true; doneScreen.hidden = true; quizWrap.hidden = false;
  const names = [...selected].map(labelFor).sort();
  el('chunkLabel').textContent = 'Studying: ' + names.join(', ');
  nextCard();
}

function statusOf(box){ return box===0?'New':box<=2?'Learning':box<=4?'Review':'Mastered'; }

function renderStats(){
  const counts = {New:0, Learning:0, Review:0, Mastered:0};
  pool.forEach(id => counts[statusOf(cardState[id].box)]++);
  el('statsRow').innerHTML = Object.entries(counts).map(([k,v])=>`<span class="stat">${k}: ${v}</span>`).join('');
  el('fill').style.width = pool.length ? `${(counts.Mastered/pool.length)*100}%` : '0%';
  return counts;
}

function pickNext(){
  const active = pool.filter(id => cardState[id].box < 5);
  if(active.length === 0) return null;
  let minDue = Math.min(...active.map(id => cardState[id].due));
  const dueNow = active.filter(id => cardState[id].due <= Math.max(minDue, turn) );
  const candidates = dueNow.length ? dueNow : active;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

const preloaded = new Set();
function preloadImage(id){
  if(preloaded.has(id)) return;
  preloaded.add(id);
  const img = new Image();
  img.onerror = () => {
    wikidataPhotoUrl(byId[id][7]).then(url => { if(url){ const img2 = new Image(); img2.src = url; } });
  };
  img.src = photoUrl(id);
}
function preloadUpcoming(excludeId){
  const active = pool.filter(id => id !== excludeId && cardState[id].box < 5);
  active
    .sort((a,b) => cardState[a].due - cardState[b].due)
    .slice(0, 4)
    .forEach(preloadImage);
}

function buildChoices(correctId){
  const correct = byId[correctId];
  const sameChamber = pool.filter(id => id!==correctId && byId[id][2]===correct[2]);
  let distractors = shuffle(sameChamber).slice(0,3);
  if(distractors.length < 3){
    const fallback = RECORDS
      .filter(r => r[2]===correct[2] && r[0]!==correctId && !distractors.includes(r[0]))
      .map(r => r[0]);
    distractors = distractors.concat(shuffle(fallback).slice(0, 3-distractors.length));
  }
  return shuffle([correctId, ...distractors]);
}

function nextCard(){
  const counts = renderStats();
  if(counts.Mastered === pool.length){ showDone(); return; }
  const id = pickNext();
  current = id;
  const rec = byId[id];
  const photo = el('photo'), fallback = el('photoFallback');
  photo.style.display = 'block'; fallback.style.display = 'none';
  const initials = rec[1].split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  el('photoInitials').textContent = initials;

  const myToken = ++photoLoadToken;
  photo.onerror = () => {
    if(myToken !== photoLoadToken) return;
    const qid = rec[7];
    wikidataPhotoUrl(qid).then(url => {
      if(myToken !== photoLoadToken) return;
      if(url){
        photo.onerror = () => { if(myToken === photoLoadToken){ photo.style.display = 'none'; fallback.style.display = 'flex'; } };
        photo.src = url;
      } else {
        photo.style.display = 'none'; fallback.style.display = 'flex';
      }
    });
  };
  photo.src = photoUrl(id);
  photo.alt = 'Member of Congress photo';
  el('chamberTag').textContent = rec[2] === 'House' ? (rec[3]==='Representative' ? 'House' : rec[3]) : rec[3];
  preloadUpcoming(id);

  const box = el('choices'); box.innerHTML = '';
  if(typingMode){
    el('promptText').textContent = 'Type their last name (full name works too):';
    box.innerHTML = `
      <form id="typeForm" class="type-form" autocomplete="off">
        <input type="text" id="typedAnswer" class="type-input" placeholder="Last name…" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button type="submit" class="btn primary">Check</button>
      </form>`;
    el('typeForm').addEventListener('submit', e => {
      e.preventDefault();
      const val = el('typedAnswer').value;
      if(!val.trim()) return;
      answerTyped(val);
    });
    el('typedAnswer').focus();
  } else {
    el('promptText').textContent = 'Who is this?';
    const choiceIds = buildChoices(id);
    choiceIds.forEach(cid=>{
      const btn = document.createElement('button');
      btn.className = 'choice'; btn.textContent = byId[cid][1];
      btn.addEventListener('click', ()=> answer(cid));
      box.appendChild(btn);
    });
  }
  el('feedback').hidden = true;
  el('quizCard').hidden = false;
}

function recordAnswer(correct){
  turn++;
  const rec = byId[current];
  const st = cardState[current];
  if(correct){ st.box = Math.min(st.box+1, 5); }
  else { st.box = 1; }
  st.due = turn + (BOX_INTERVAL[st.box] ?? 999);

  el('verdict').textContent = correct ? 'Correct!' : `Incorrect. That's ${rec[1]}.`;
  el('verdict').className = 'verdict ' + (correct ? 'good' : 'bad');
  const place = rec[5] ? `${rec[4]}-${String(rec[5]).padStart(2,'0')}` : rec[4];
  el('meta').textContent = `${rec[3]}, ${place}`;
  el('partyChip').textContent = PARTY_NAME[rec[6]];
  el('partyChip').className = 'chip ' + rec[6];
  el('feedback').hidden = false;
  saveProgress();
}

function answer(pickedId){
  const rec = byId[current];
  const correct = pickedId === current;
  [...el('choices').children].forEach(btn=>{
    if(btn.tagName !== 'BUTTON' || !btn.classList.contains('choice')) return;
    btn.disabled = true;
    const isThisCorrect = btn.textContent === rec[1];
    if(isThisCorrect) btn.classList.add('correct');
    else if(btn.textContent === byId[pickedId][1] && !correct) btn.classList.add('wrong');
  });
  recordAnswer(correct);
}

function answerTyped(raw){
  const rec = byId[current];
  const correct = surnameMatches(raw, rec[1]);
  const input = el('typedAnswer');
  input.value = raw;
  input.disabled = true;
  input.classList.add(correct ? 'correct' : 'wrong');
  const submitBtn = el('typeForm')?.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  recordAnswer(correct);
}

el('nextBtn').addEventListener('click', nextCard);

function showDone(){
  quizWrap.hidden = true; doneScreen.hidden = false;
  const names = [...selected].map(labelFor).sort().join(', ');
  el('doneStats').textContent = typingMode
    ? `Every card in ${names} has reached box 5 in typing mode too.`
    : `Every card in ${names} has reached box 5. Try typing mode for a harder review, or add more categories to keep going.`;
  el('typingModeBtn').hidden = typingMode;
}

el('resetProgressBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all saved progress and start over? This can\'t be undone.')) return;
  try{ localStorage.removeItem(STORAGE_KEY); } catch(e){}
  location.reload();
});

</script>
</body>
</html>
